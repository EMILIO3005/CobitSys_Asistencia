<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CobitSys | Asistencia</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css" rel="stylesheet">
    <script type="module" src="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/js/bootstrap.bundle.min.js"></script>
    <link rel="stylesheet" href="/css/dashboard.css">
</head>

<body>
    <header class="topbar">

        <div class="logo">
            <div class="logo-icon">
                <i class="bi bi-people-fill"></i>
            </div>
            <span>CobitSys<span class="logo-light">Asistencia</span></span>
        </div>
        <div class="search-container">
            <i class="bi bi-search"></i>
            <input type="search" placeholder="Buscar empleados, áreas, registros...">
        </div>
        <div class="top-right">
            <div class="top-actions">
                <div class="dropdown">
                    <button class="top-button position-relative" data-bs-toggle="dropdown" aria-expanded="false">
                        <i class="bi bi-bell"></i>
                        <span class="notification-count">3</span>
                    </button>
                    <div class="dropdown-menu dropdown-menu-end notification-menu">
                    </div>
                </div>
                <button class="top-button" title="Ayuda">
                    <i class="bi bi-question-circle"></i>
                </button>
            </div>
            <div class="user">
                <h2 id="who"></h2>
                <button type="button" id="logout" class="btn btn-outline theme-danger">Cerrar sesión</button>
            </div>
        </div>
    </header>
    <div class="shell">
        <aside class="sidebar">
            <div class="sidebar-title">MENÚ PRINCIPAL</div>
            <a href="#" class="nav-item active">
                <i class="bi bi-grid"></i>
                <span>Dashboard</span>
            </a>
            <a href="#" class="nav-item" id="menuAsistencia">
                <i class="bi bi-calendar-check"></i>
                <span>Asistencia</span>
            </a>
            <a href="#" class="nav-item" id="menuRegistros">
                <i class="bi bi-clipboard-data"></i>
                <span>Registros</span>
            </a>
            <a href="#" class="nav-item" id="menuEmpleados">
                <i class="bi bi-people"></i>
                <span>Empleados</span>
            </a>
            <a href="#" class="nav-item" id="menuArea">
                <i class="bi bi-building"></i>
                <span>Áreas y sedes</span>
            </a>
            <a href="#" class="nav-item" id="menuReportes">
                <i class="bi bi-bar-chart"></i>
                <span>Reportes</span>
            </a>
            <div class="sidebar-title mt-4">CONFIGURACIÓN</div>
            <a href="#" class="nav-item">
                <i class="bi bi-gear"></i>
                <span>Configuración</span>
            </a>
            <a href="#" class="nav-item">
                <i class="bi bi-shield-lock"></i>
                <span>Seguridad</span>
            </a>
            <div class="sidebar-footer">
                <i class="bi bi-shield-check"></i>
                <span>CobitSys v1.0</span>
            </div>
        </aside>
        <main class="main-content" id="mainContent">
            <h2>Dashboard de asistencia</h2>
            <p>Bienvenido al sistema de control de asistencia.</p>
        </main>
    </div>
    <script src="./js/app.js"></script>
</body>

</html>
